        The container must be in `exited` state or it will be considered as
        unremovable, this is to put some safeguards in place.


        Volumes and networks are not removed via this API, they must be removed
        separately via two other API calls, same with secrets and .env files.


        You also need a security key to be able to delete a `container` or it
