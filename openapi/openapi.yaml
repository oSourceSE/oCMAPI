                  Message:
                    type: string
                  Error:
                    type: string
      description: >-
        With this API you can start, stop, pause and so on for a single
        container.


        Valid states to user are: `start`, `stop`, `pause`, `unpause` &
        `restart`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                state:
                  type: string
