  /v1/common/postRepoAuthLogin:
    post:
      summary: postRepoAuthLogin
      operationId: ocmapi_common_postrepoauthlogin_yml
      description: >-
        When a repository require authentication befor any image can be pulled.


        Currently only works with repositories that implements basic
        authentication like username & password.


        Example:


        ``` json

        {
          "repository": "repo_address",
          "username": "username",
          "password": "password"
        }

         ```
      tags:
        - Common
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: <string>
                message: <string>
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                  Message:
                    type: string
                  Error:
                    type: string
              example:
                Code: <integer>
                Message: <string>
                Error: <string>
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
      requestBody:
        $ref: '#/components/requestBodies/postrepoauthlogin'
      security:
        - postrepoauthlogin: []
  /v1/common/postEnvFileCreate:
    post:
      summary: postEnvFileCreate
      operationId: ocmapi_common_postenvfilecreate_yml
      description: >-
        Create or replace an `env` file with parameters used in containers, good
        for moving variables like `usernames`, `passwords` and so on from the
        create command when creating a container.


        The file will automatically get the `.env` added at the end, so the
        `name` tag should only contain the name you want to give it.


        the `content` data must be separated with a `|` in order for the API to
        successfully split the data into correct format, there are no need to
        add an `|` after final variable.


        Example:


        ``` json

        {
          "name": "filename",
          "content": "USER=user|PASS=password",
          "replace": "no"
        }

         ```

        You can overwrite an existing file by setting the `replace` tag to yes,
        otherwise it will not do anything if the file already exists. The
        `replace` tag can only consist of the words `yes` or `no`, if you put
        something else here it will halt and error out.


        Example:


        ``` json

        {
          "name": "filename",
          "content": "USER=user|PASS=password",
          "replace": "yes"
        }

         ```
      tags:
        - Common
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  File:
                    type: string
                  Message:
                    type: string
                  Status:
                    type: string
              example:
                File: <string>
                Message: <string>
                Status: <integer>
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                  Message:
                    type: string
                  Error:
                    type: string
              example:
                Code: <integer>
                Message: <string>
                Error: <string>
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
      requestBody:
        $ref: '#/components/requestBodies/postenvfilecreate'
      security:
        - postenvfilecreate: []
