                  Status:
                    type: object
                    properties:
                      type:
                        type: string
              example:
                Code:
                  type: integer
                Info:
                  type: string
                File:
                  type: string
                Status:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: object
                    properties:
                      type:
                        type: string
                  Info:
