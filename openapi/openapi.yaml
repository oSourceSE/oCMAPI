  /v1/containers/create:
    post:
      summary: /v1/containers/create
      tags:
        - Containers
      operationId: postContainerCreateInfo
      security:
        - basicAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  Message:
                    type: string
                  ID:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
        '500':
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
      description: >-
        API for creating a container.


        All options needs to be separated with a comma (`,`) and start with `--`
        or they will be invalid.


        For example like this:

        ```json

        {
          "name": "MyContainer",
          "image": "/full/path/to/repo/image:tag",
          "options": "--option1,--option2=value2"
        }

        ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                image:
                  type: string
                options:
                  type: string
  /v1/containers/setstate:
    post:
      summary: /v1/containers/setstate
      tags:
