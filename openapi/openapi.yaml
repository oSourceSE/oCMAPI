openapi: 3.0.0
info:
  title: oCMAPI
  version: 1.0.0
  license: 
    name: BSD License
    url: https://www.osource.se/license.html
  description: >-
    Container Management API for podman containers.


    A project sprung out of the urge to learn rust and wanting to build a `API`
    for managing `podman` containers in my local environment.


    All requests and responses are JSON based for all API endpoints.
servers:
  - url: ''
paths:
  /v1/common/stats:
    get:
      summary: /v1/common/stats
      tags:
        - Common
      operationId: getLiveStatistics
      security:
        - basicAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  cpu_time:
                    type: string
                  cpu_percent:
                    type: string
                  avg_cpu:
                    type: string
                  mem_usage:
                    type: string
                  mem_percent:
                    type: string
                  net_io:
                    type: string
                  block_io:
                    type: string
                  pids:
                    type: string
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
        '500':
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
      description: Get current statistics for CPU, Memory and so on for all running containers.
  /v1/common/version:
    get:
      summary: /v1/common/version
      tags:
        - Common
      operationId: getPodmanVersion
      security:
        - basicAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Client:
                    type: object
                    properties:
                      APIVersion:
                        type: string
                      Version:
                        type: string
                      GoVersion:
                        type: string
                      GitCommit:
                        type: string
                      BuiltTime:
                        type: string
                      Built:
                        type: integer
                      OsArch:
                        type: string
                      Os:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
      description: Get information about your current version of podman.
  /v1/common/info:
    get:
      summary: /v1/common/info
      tags:
        - Common
      operationId: getPodmanInfo
      security:
        - basicAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: object
                    properties:
                      arch:
                        type: string
                      buildahVersion:
                        type: string
                      cgroupManager:
                        type: string
                      cgroupVersion:
                        type: string
                      cgroupControllers:
                        type: array
                        items:
                          type: string
                      conmon:
                        type: object
                        properties:
                          package:
                            type: string
                          path:
                            type: string
                          version:
                            type: string
                      cpus:
                        type: string
                      cpuUtilization:
                        type: object
                        properties:
                          userPercent:
                            type: string
                          systemPercent:
                            type: string
                          idlePercent:
                            type: string
                      databaseBackend:
                        type: string
                      distribution:
                        type: object
                        properties:
                          distribution:
                            type: string
                          version:
                            type: string
                          codename:
                            type: string
                      eventLogger:
                        type: string
                      freeLocks:
                        type: string
                      hostname:
                        type: string
                      idMappings:
                        type: object
                        properties:
                          gidmap:
                            type: array
                            items:
                              type: object
                              properties:
                                container_id:
                                  type: string
                                host_id:
                                  type: string
                                size:
                                  type: string
                          uidmap:
                            type: array
                            items:
                              type: object
                              properties:
                                container_id:
                                  type: string
                                host_id:
                                  type: string
                                size:
                                  type: string
                      kernel:
                        type: string
                      logDriver:
                        type: string
                      memFree:
                        type: string
                      memTotal:
                        type: string
                      networkBackend:
                        type: string
                      networkBackendInfo:
                        type: object
                        properties:
                          backend:
                            type: string
                          version:
                            type: string
                          package:
                            type: string
                          path:
                            type: string
                          dns:
                            type: object
                            properties:
                              version:
                                type: string
                              package:
                                type: string
                              path:
                                type: string
                      ociRuntime:
                        type: object
                        properties:
                          name:
                            type: string
                          package:
                            type: string
                          path:
                            type: string
                          version:
                            type: string
                      os:
                        type: string
                      remoteSocket:
                        type: object
                        properties:
                          path:
                            type: string
                          exists:
                            type: string
                      serviceIsRemote:
                        type: string
                      security:
                        type: object
                        properties:
                          apparmorEnabled:
                            type: string
                          capabilities:
                            type: string
                          rootless:
                            type: string
                          seccompEnabled:
                            type: string
                          seccompProfilePath:
                            type: string
                          selinuxEnabled:
                            type: string
                      slirp4netns:
                        type: object
                        properties:
                          executable:
                            type: string
                          package:
                            type: string
                          version:
                            type: string
                      pasta:
                        type: object
                        properties:
                          executable:
                            type: string
                          package:
                            type: string
                          version:
                            type: string
                      swapFree:
                        type: string
                      swapTotal:
                        type: string
                      uptime:
                        type: string
                      variant:
                        type: string
                      linkmode:
                        type: string
                  store:
                    type: object
                    properties:
                      configFile:
                        type: string
                      containerStore:
                        type: object
                        properties:
                          number:
                            type: string
                          paused:
                            type: string
                          running:
                            type: string
                          stopped:
                            type: string
                      graphDriverName:
                        type: string
                      graphOptions:
                        type: object
                        properties:
                          overlay.mountopt:
                            type: string
                      graphRoot:
                        type: string
                      graphRootAllocated:
                        type: string
                      graphRootUsed:
                        type: string
                      graphStatus:
                        type: object
                        properties:
                          Backing Filesystem:
                            type: string
                          Native Overlay Diff:
                            type: string
                          Supports d_type:
                            type: string
                          Supports shifting:
                            type: string
                          Supports volatile:
                            type: string
                          Using metacopy:
                            type: string
                      imageCopyTmpDir:
                        type: string
                      imageStore:
                        type: object
                        properties:
                          number:
                            type: string
                      runRoot:
                        type: string
                      volumePath:
                        type: string
                      transientStore:
                        type: string
                  registries:
                    type: object
                    properties:
                      search:
                        type: array
                        items:
                          type: string
                  plugins:
                    type: object
                    properties:
                      volume:
                        type: array
                        items:
                          type: string
                      network:
                        type: array
                        items:
                          type: string
                      log:
                        type: array
                        items:
                          type: string
                      authorization:
                        type: string
                  version:
                    type: object
                    properties:
                      APIVersion:
                        type: string
                      Version:
                        type: string
                      GoVersion:
                        type: string
                      GitCommit:
                        type: string
                      BuiltTime:
                        type: string
                      Built:
                        type: string
                      OsArch:
                        type: string
                      Os:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
      description: Get complete information about your podman environment.
