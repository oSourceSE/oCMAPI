      operationId: postContainerStateChange
      security:
        - basicAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  State:
                    type: string
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Info:
