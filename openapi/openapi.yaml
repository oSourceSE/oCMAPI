  /v1/common/postSecretCreate:
    post:
      summary: postSecretCreate
      operationId: ocmapi_common_postsecretcreate_yml
      description: >-
        Create or replace a `secret` with information used in containers, good
        for moving variables like `usernames`, `passwords` and so on from the
        create command when creating a container.


        During the creation or replacement of a `secret` a temporary file is
        placed under the folder assigned in the configuration file. This file
        will automatically get the `.tmp` added at the end and the file should
        be removed automatically when operation is successful.


        the `data` tag is sent in as is into the secret so be sure to format it
        correctly before it is processed.


        The `labels` tag is used for adding labels for the secret, they can be
        viewed with the `inspect` command, each label is separated with a `,`
        and is in the form of `LabelName=LabelValue`.


        Example:


        ``` json

        {
          "name": "secretname",
          "content": "MySecretPassword",
          "labels": "<label1>=<string>,<label2>=<string>",
          "replace": "no"
        }

         ```

        You can overwrite an existing `secret` by setting the `replace` tag to
        yes, otherwise it will not do anything if the `secret` already exists.
        The `replace` tag can only consist of the words `yes` or `no`, if you
        put something else here it will halt and error out.


        Example:


        ``` json

        {
          "name": "secretname",
          "content": "MyNewSecretPassword",
          "labels": "<label1>=<string>,<label2>=<string>",
          "replace": "yes"
        }

         ```
      tags:
        - Common
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  data:
                    type: string
                  labels:
                    type: string
                  replace:
                    type: string
              example:
                name: <string>
                data: <string>
                labels: <string
                replace: <string>
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                  Message:
                    type: string
                  Error:
                    type: string
              example:
                Code: <integer>
                Message: <string>
                Error: <string>
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                  Message:
                    type: string
                  Error:
                    type: string
              example:
                Code: <integer>
                Message: <string>
                Error: <string>
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
      requestBody:
        $ref: '#/components/requestBodies/postsecretcreate'
      security:
        - postsecretcreate: []
