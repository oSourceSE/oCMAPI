openapi: 3.0.0
info:
  title: oCMAPI
  version: 1.0.9
  license: 
   name: BSD License
   url: https://www.osource.se/license.html
paths:
  /v1/common/getStats:
    get:
      summary: getStats
      operationId: ocmapi_common_getstats_yml
      description: >-
        Get current statistics for CPU, Memory and so on for all running
        containers.
      tags:
        - Common
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    cpu_time:
                      type: string
                    cpu_percent:
                      type: string
                    avg_cpu:
                      type: string
                    mem_usage:
                      type: string
                    mem_percent:
                      type: string
                    net_io:
                      type: string
                    block_io:
                      type: string
                    pids:
                      type: string
              example:
                - id: <string>
                  name: <string>
                  cpu_time: <string>
                  cpu_percent: <string>
                  avg_cpu: <string>
                  mem_usage: <string>
                  mem_percent: <string>
                  net_io: <string>
                  block_io: <string>
                  pids: <string>
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                  Message:
                    type: string
                  Error:
                    type: string
              example:
                Code: <integer>
                Message: <string>
                Error: <string>
      parameters:
        - name: Accept
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: application/json
      security:
        - getstats: []
